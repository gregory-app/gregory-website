name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # Run by hand, the job can name its runner: when GitHub's hosted runners do not
  # take jobs (a billing hold, 2026-10-05), a one-off runner on a Mac deploys instead.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (ubuntu-latest, or a self-hosted runner's label)
        default: ubuntu-latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # enablement: true switches the Pages source from a branch build to this
      # workflow, so a push from any actor deploys the site.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The whole repo root is the site; the action excludes .git and .github.
      # CNAME travels with the artifact, so the custom domain is preserved.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
